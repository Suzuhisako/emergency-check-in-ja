<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>緊急安否確認 (Lite)</title>

  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #121212; color: #e0e0e0; }
    .card-dark { background-color: #1e1e1e; border: 1px solid #2d2d2d; }
    
    /* Button Styling */
    .btn-outline-blue {
      color: #066f8f;
      border: 1px solid #066f8f;
      background-color: transparent;
      -webkit-tap-highlight-color: transparent;
    }
    @media (hover: hover) {
      .btn-outline-blue:hover { color: #fff; background-color: #066f8f; border-color: #066f8f; }
    }
    .btn-outline-blue:focus,
    .btn-outline-blue:active,
    .btn-outline-blue.active {
      color: #fff !important;
      background-color: #066f8f !important;
      border-color: #066f8f !important;
      box-shadow: none !important;
    }
  </style>
</head>
<body class="py-4">

  <div class="container" style="max-width: 500px;">
    
    <!-- Header -->
    <div class="text-center mb-4">
      <h2 class="fw-bold text-light">🆘 緊急安否確認</h2>
      <p class="fw-bold text-light">オフライン対応 • SMSで緊急連絡</p>
    </div>
  
    <!-- Step 1: Self Check-In Form -->
    <section class="card-dark rounded-3 p-3 mb-4">
      <h2 class="h6 text-uppercase text-light fw-bold mb-3">1. 安否情報の送信</h2>
  
      <!-- Status Selection -->
      <label class="form-label fw-bold mb-2 small text-light">安否/状況を選択</label>
      <div class="row g-2 mb-3">
        <div class="col-6">
          <button type="button" class="btn btn-outline-success status-btn fw-bold w-100 py-2 active" onclick="setStatus('🟢 SAFE', this)">
            🟢 無事/安全
          </button>
        </div>
        <div class="col-6">
          <button type="button" class="btn btn-outline-warning status-btn fw-bold w-100 py-2" onclick="setStatus('🟡 IN TRANSIT', this)">
            🟡 移動中
          </button>
        </div>
        <div class="col-6">
          <button type="button" class="btn btn-outline-blue status-btn fw-bold w-100 py-2" onclick="setStatus('🔵 EVACUATED', this)">
            🔵 避難完了
          </button>
        </div>
        <div class="col-6">
          <button type="button" class="btn btn-outline-danger status-btn fw-bold w-100 py-2" onclick="setStatus('🔴 NEED HELP', this)">
            🔴 要救援
          </button>
        </div>
      </div>
  
      <!-- Location Capture -->
      <div class="mb-3">
        <label class="form-label fw-bold small text-light mb-1">位置情報の取得</label>
        <button type="button" class="btn btn-secondary w-100 py-2 fw-bold" onclick="getGPSLocation()">
          📍 GPS位置情報を自動取得
        </button>
        
        <div class="text-center mt-2">
          <div id="gpsStatus" class="fw-bold text-light small">上のボタンを押して位置情報を添付</div>
          <div id="gpsCoordsDisplay" class="font-monospace text-info fw-bold mt-1 fs-6 d-none"></div>
        </div>
      </div>
  
      <!-- Note Input -->
      <div class="mb-3">
        <label for="statusNote" class="form-label fw-bold small text-light">メモ (任意)</label>
        <input type="text" class="form-control bg-dark text-light border-secondary" id="statusNote" placeholder="例: 家族と避難所にいます" oninput="updateSelfCardAuto()">
      </div>
  
      <!-- Recipient Select -->
      <div class="mb-4">
        <label for="smsRecipient" class="form-label fw-bold small text-light">送信先を選択</label>
        <select class="form-select bg-dark text-light border-secondary" id="smsRecipient">
          <option value="">-- 送信先を選択してください --</option>
        </select>
      </div>
  
      <!-- Send Button -->
      <button type="button" class="btn btn-primary btn-lg w-100 fw-bold py-3" onclick="copyAndOpenSMS()">
        💬 SMSで安否送信
      </button>
  
      <div id="copyAlert" class="alert alert-success text-center mt-3 d-none mb-0" role="alert">
        📋 メッセージをクリップボードにコピーしました！SMSアプリを開きます...
      </div>
    </section>
  
    <!-- Step 2: Family Status Board -->
    <section class="card-dark rounded-3 p-3 mb-3">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h6 text-uppercase text-light fw-bold m-0">2. 家族の安否掲示板</h2>
        <div>
          <button type="button" class="btn btn-sm btn-info py-0 px-2 me-1" onclick="openImportSMSModal()">📥 SMS読込</button>
          <button type="button" class="btn btn-sm btn-success py-0 px-2 me-1" onclick="openAddModal()">+ 追加</button>
          <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2" onclick="simulateIncomingPacket()">メッシュ転送</button>
        </div>
      </div>
  
      <div class="list-group list-group-flush" id="familyList"></div>
    </section>
  
  </div>
  
  <!-- Family Member Modal (Add/Edit) -->
  <div class="modal fade" id="familyModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark text-light border-secondary">
        <div class="modal-header border-secondary">
          <h5 class="modal-title" id="modalTitle">家族の追加</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="閉じる"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="modalMemberId">
          
          <div class="mb-3">
            <label class="form-label">名前</label>
            <input type="text" id="modalMemberName" class="form-control bg-dark text-light border-secondary" placeholder="例: 太郎">
          </div>
  
          <div class="mb-3">
            <label for="modalMemberPhone" class="form-label">電話番号 (SMS用)</label>
            <input 
              type="tel" 
              class="form-control bg-dark text-light border-secondary" 
              id="modalMemberPhone" 
              placeholder="例: 090-1234-5678 または +819012345678"
              maxlength="20"
              autocomplete="tel"
            >
            <div class="form-text text-secondary" style="font-size: 0.8rem;">
              海外の番号の場合は国番号を含めて入力してください（例: 日本 +81、米国 +1）。
            </div>
          </div>
            
          <div class="mb-3">
            <label class="form-label">ステータス</label>
            <select id="modalMemberStatus" class="form-select bg-dark text-light border-secondary">
              <option value="SAFE">無事・安全 (SAFE)</option>              
              <option value="IN TRANSIT">移動中 (IN TRANSIT)</option>
              <option value="EVACUATED">避難完了 (EVACUATED)</option>
              <option value="NEED HELP">救援が必要 (NEED HELP)</option>
            </select>
          </div>
            
          <div class="mb-3">
            <label class="form-label">場所 / メモ</label>
            <input type="text" id="modalMemberLocation" class="form-control bg-dark text-light border-secondary" placeholder="例: 自宅、避難所">
          </div>
        </div>
        <div class="modal-footer border-secondary">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
          <button type="button" class="btn btn-primary" onclick="saveFamilyMember()">保存</button>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Import SMS Modal -->
  <div class="modal fade" id="importModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark text-light border-secondary">
        <div class="modal-header border-secondary">
          <h5 class="modal-title">📥 受信SMSの読み込み</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p class="small text-secondary">家族から受け取ったメッセージ本文を貼り付けると、自動で解析して掲示板を更新します:</p>
          <textarea id="importSmsText" class="form-control bg-dark text-light border-secondary mb-3" rows="3" placeholder="受信したSMSメッセージをここに貼り付け..."></textarea>
        </div>
        <div class="modal-footer border-secondary">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
          <button type="button" class="btn btn-info" onclick="processImportSMS()">ステータス更新</button>
        </div>
      </div>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Initial Data State
    let familyData = [
      { id: "usr_self_01", name: "自分", phone: "", status: "SAFE", note: "自宅", bat: "100%", ts: "本日 08:00" },
      { id: "usr_fam_02", name: "太郎", phone: "+819012345678", status: "SAFE", note: "避難所", bat: "85%", ts: "昨日" }
    ];
  
    let currentStatus = "🟢 SAFE";
    let currentCoords = null;
    let liveBattery = "100";
    let familyModalObj = null;
    let importModalObj = null;
  
    window.addEventListener('DOMContentLoaded', () => {
      familyModalObj = new bootstrap.Modal(document.getElementById('familyModal'));
      importModalObj = new bootstrap.Modal(document.getElementById('importModal'));
      
      loadFamilyData();
      renderFamilyBoard();
      updateRecipientDropdown();
  
      if ('getBattery' in navigator) {
        navigator.getBattery().then((battery) => {
          liveBattery = Math.round(battery.level * 100);
          battery.addEventListener('levelchange', () => {
            liveBattery = Math.round(battery.level * 100);
          });
        });
      }
    });
  
    function setStatus(statusText, btnElement) {
      currentStatus = statusText;
      document.querySelectorAll('.status-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
  
      updateSelfCardAuto();
    }
  
    function updateSelfCardAuto() {
      if (familyData.length > 0) {
        const noteInput = document.getElementById("statusNote");
        const noteText = noteInput && noteInput.value.trim() !== "" ? noteInput.value.trim() : "メモなし";
  
        // Build GPS link if location was captured
        let gpsLinkText = "";
        if (currentCoords && currentCoords.lat && currentCoords.lon) {
          gpsLinkText = ` 📍 https://maps.google.com/?q=${currentCoords.lat},${currentCoords.lon}`;
        }
  
        // Clean status string (removes emoji symbols)
        familyData[0].status = currentStatus.replace(/[^A-Za-z\s]/g, '').trim();
        // Combine note + GPS link
        familyData[0].note = noteText + gpsLinkText;
        familyData[0].bat = `${liveBattery}%`;
        familyData[0].ts = "たった今";
  
        saveFamilyData();
        renderFamilyBoard();
      }
    }
  
    function getGPSLocation() {
      const gpsMsg = document.getElementById("gpsStatus");
      const coordsDisplay = document.getElementById("gpsCoordsDisplay");
      
      if (gpsMsg) gpsMsg.textContent = "⌛ 衛星を探しています...";
  
      const options = { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 };
  
      navigator.geolocation.getCurrentPosition(
        (position) => {
          currentCoords = {
            lat: position.coords.latitude.toFixed(5),
            lon: position.coords.longitude.toFixed(5)
          };
  
          if (gpsMsg) gpsMsg.textContent = "📍 GPS位置情報の取得に成功しました！";
          if (coordsDisplay) {
            coordsDisplay.textContent = `緯度: ${currentCoords.lat} | 経度: ${currentCoords.lon}`;
            coordsDisplay.classList.remove("d-none");
          }
  
          // 🔄 Auto-update Self card on the board as soon as GPS fixes!
          updateSelfCardAuto();
        },
        (error) => {
          console.warn("GPS Error:", error);
          if (gpsMsg) gpsMsg.textContent = "⚠️ GPS位置情報を取得できませんでした。";
          if (coordsDisplay) coordsDisplay.classList.add("d-none");
        },
        options
      );
    }
  
    function copyAndOpenSMS() {
      const recipientSelect = document.getElementById("smsRecipient");
      const recipientPhone = recipientSelect ? recipientSelect.value : "";
  
      if (recipientSelect && recipientSelect.selectedIndex === 0) {
        alert("最初にドロップダウンから送信先を選択してください。");
        return;
      }
  
      const noteInput = document.getElementById("statusNote");
      const noteText = noteInput && noteInput.value.trim() !== "" ? noteInput.value.trim() : "メモなし";
  
      let gpsString = "なし";
      if (currentCoords && currentCoords.lat && currentCoords.lon) {
        gpsString = `https://maps.google.com/?q=${currentCoords.lat},${currentCoords.lon}`;
      }
  
      const cleanPhone = recipientPhone.trim().replace(/[^0-9+]/g, '');
      const textToCopy = `[緊急安否確認] ステータス: ${currentStatus} | GPS: ${gpsString} | バッテリー: ${liveBattery}% | メモ: ${noteText}`;
  
      // Update Self on Board
      if (familyData.length > 0) {
        familyData[0].status = currentStatus.replace(/[^A-Za-z\s]/g, '').trim();
        familyData[0].note = noteText;
        familyData[0].bat = `${liveBattery}%`;
        familyData[0].ts = "たった今";
        saveFamilyData();
        renderFamilyBoard();
      }
  
      navigator.clipboard.writeText(textToCopy).then(() => {
        const alertElem = document.getElementById("copyAlert");
        if (alertElem) {
          alertElem.classList.remove("d-none");
          setTimeout(() => alertElem.classList.add("d-none"), 4000);
        }
  
        setTimeout(() => {
          window.location.href = cleanPhone ? `sms:${cleanPhone}` : `sms:`;
        }, 1200);
      }).catch(() => {
        alert("手動でコピーしました: " + textToCopy);
      });
    }
  
    /* --- FAMILY BOARD CRUD FUNCTIONS --- */
  
    function loadFamilyData() {
      const saved = localStorage.getItem("family_board_status");
      if (saved) {
        try { familyData = JSON.parse(saved); } catch (e) { console.warn(e); }
      }
    }
  
    function saveFamilyData() {
      localStorage.setItem("family_board_status", JSON.stringify(familyData));
    }
  
    function renderFamilyBoard() {
      const listElem = document.getElementById("familyList");
      if (!listElem) return;
  
      listElem.innerHTML = "";
  
      familyData.forEach((member, index) => {
        let badgeClass = "bg-success";
        if (member.status.includes("TRANSIT")) badgeClass = "bg-warning text-dark";
        if (member.status.includes("EVACUATED")) badgeClass = "bg-info text-dark";
        if (member.status.includes("HELP")) badgeClass = "bg-danger";
  
        const item = document.createElement("div");
        item.className = "list-group-item bg-dark text-light border-secondary p-2 d-flex justify-content-between align-items-center";
  
        item.innerHTML = `
          <div>
            <div class="fw-bold">${member.name} <span class="badge ${badgeClass} ms-1">${member.status}</span></div>
            <div class="small text-secondary">${member.note || "メモなし"} ${member.phone ? ' | 📱 ' + member.phone : ''}</div>
          </div>
          <div class="text-end">
            <div class="small text-secondary">🔋 ${member.bat || '100%'}</div>
            <div>
              <button class="btn btn-link btn-sm text-info p-0 me-2" onclick="openEditModal(${index})">編集</button>
              ${index > 0 ? `<button class="btn btn-link btn-sm text-danger p-0" onclick="deleteFamilyMember(${index})">削除</button>` : ''}
            </div>
          </div>
        `;
        listElem.appendChild(item);
      });
  
      updateRecipientDropdown();
    }
  
    function updateRecipientDropdown() {
      const select = document.getElementById("smsRecipient");
      if (!select) return;
    
      select.innerHTML = '<option value="">-- 送信先を選択してください --</option>';
      familyData.forEach((member) => {
        const opt = document.createElement("option");
        // Use the phone number if available, otherwise fallback to empty string
        opt.value = member.phone || ""; 
        
        // Display phone number in label if present, otherwise just show name
        const phoneDisplay = member.phone ? ` (${member.phone})` : " (自分用のメモ)";
        opt.textContent = `${member.name}${phoneDisplay}`;
        
        select.appendChild(opt);
      });
    }
  
    function openAddModal() {
      document.getElementById("modalTitle").textContent = "家族の追加";
      document.getElementById("modalMemberId").value = "";
      document.getElementById("modalMemberName").value = "";
      document.getElementById("modalMemberPhone").value = "";
      document.getElementById("modalMemberStatus").value = "SAFE";
      document.getElementById("modalMemberLocation").value = "";
      familyModalObj.show();
    }
  
    function openEditModal(index) {
      const m = familyData[index];
      document.getElementById("modalTitle").textContent = "家族情報の編集";
      document.getElementById("modalMemberId").value = index;
      document.getElementById("modalMemberName").value = m.name;
      document.getElementById("modalMemberPhone").value = m.phone || "";
      document.getElementById("modalMemberStatus").value = m.status;
      document.getElementById("modalMemberLocation").value = m.note || "";
      familyModalObj.show();
    }
  
    function saveFamilyMember() {
      const idVal = document.getElementById("modalMemberId").value;
      const name = document.getElementById("modalMemberName").value.trim();
      const phone = document.getElementById("modalMemberPhone").value.trim();
      const status = document.getElementById("modalMemberStatus").value;
      const note = document.getElementById("modalMemberLocation").value.trim();
  
      if (!name) { alert("名前を入力してください。"); return; }
  
      if (idVal !== "") {
        const idx = parseInt(idVal, 10);
        familyData[idx] = { ...familyData[idx], name, phone, status, note, ts: "たった今更新" };
      } else {
        familyData.push({
          id: `usr_fam_${Date.now()}`,
          name, phone, status, note, bat: "100%", ts: "たった今追加"
        });
      }
  
      saveFamilyData();
      renderFamilyBoard();
      familyModalObj.hide();
    }
  
    function deleteFamilyMember(index) {
      if (confirm(`${familyData[index].name} さんを削除してもよろしいですか？`)) {
        familyData.splice(index, 1);
        saveFamilyData();
        renderFamilyBoard();
      }
    }
  
    /* --- IMPORT & SIMULATION FUNCTIONS --- */
  
    function openImportSMSModal() {
      document.getElementById("importSmsText").value = "";
      importModalObj.show();
    }
  
    function processImportSMS() {
      const raw = document.getElementById("importSmsText").value;
      if (!raw.trim()) return;
  
      // 1. Parse Status
      const statusMatch = raw.match(/\b(SAFE|IN TRANSIT|EVACUATED|NEED HELP)\b/i);
      
      // 2. Parse Note
      const noteMatch = raw.match(/(?:Note|メモ):\s*([^|]+)/i);
  
      // 3. Parse Battery (looks for "Batt: 21%", "バッテリー: 21%", or "21%")
      const batMatch = raw.match(/(?:Batt:\s*|battery\s*|batt\s*|バッテリー:\s*|バッテリー\s*)?(\d{1,3})\s*%/i);
  
      if (!statusMatch) {
        alert("有効なステータス（SAFE, IN TRANSIT, EVACUATED, NEED HELP）が検出できませんでした。");
        return;
      }
  
      const parsedStatus = statusMatch[0].toUpperCase();
      const parsedNote = noteMatch ? noteMatch[1].trim() : raw.trim(); // Fallback to full text if no "Note:" label
      const parsedBat = batMatch ? `${batMatch[1]}%` : null;
  
      // 4. Identify WHICH family member sent this
      let targetIndex = -1;
  
      familyData.forEach((member, index) => {
        if (index === 0) return; // Skip "Self (You)"
  
        const cleanMemberPhone = member.phone ? member.phone.replace(/[^0-9]/g, '') : '';
        const cleanRawText = raw.replace(/[^0-9]/g, '');
  
        if (cleanMemberPhone && cleanRawText.includes(cleanMemberPhone)) {
          targetIndex = index;
        } else if (member.name && raw.toLowerCase().includes(member.name.toLowerCase())) {
          targetIndex = index;
        }
      });
  
      // Fallback to second item (Taro / index 1) if no name/phone matched
      if (targetIndex === -1 && familyData.length > 1) {
        targetIndex = 1;
      }
  
      // 5. Update the matched member's card
      if (targetIndex !== -1) {
        familyData[targetIndex].status = parsedStatus;
        familyData[targetIndex].note = parsedNote;
        
        // Update battery if a percentage was found
        if (parsedBat) {
          familyData[targetIndex].bat = parsedBat;
        }
        
        familyData[targetIndex].ts = "たった今読み込み";
  
        saveFamilyData();
        renderFamilyBoard();
        alert(`${familyData[targetIndex].name} さんのステータスとバッテリー情報を更新しました！`);
      }
  
      importModalObj.hide();
    }
  
    function simulateIncomingPacket() {
      if (familyData.length > 1) {
        familyData[1].status = "IN TRANSIT";
        familyData[1].note = "南避難所へ移動中 (メッシュ転送)";
        familyData[1].ts = "たった今";
        saveFamilyData();
        renderFamilyBoard();
      }
    }

    if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
    }
  </script>

</body>
</html>
